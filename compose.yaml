name: taskapi-assignment
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: taskapi
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: taskapi
      RABBITMQ_DEFAULT_PASS: taskapi
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ConnectionStrings__Tasks: Host=postgres;Port=5432;Database=tasks;Username=taskapi;Password=taskapi
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    stop_grace_period: 10s
volumes:
  postgres-data:
